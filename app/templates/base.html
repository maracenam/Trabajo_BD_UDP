<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Mundial · {% block titulo %}Sistema{% endblock %}</title>
<style>
  :root { --azul:#3f5f7f; --azul2:#2d4760; --rosa:#f1e1e1; --fondo:#fbf7f4; --borde:#e2d6d3;
          --ok:#2f7d4f; --warn:#b7791f; --err:#b33a3a; --texto:#2b2b2b; --gris:#6b6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:var(--fondo); color:var(--texto); font-size:15px; }
  header { background:var(--azul); color:#fff; padding:0 24px; display:flex; align-items:center;
           gap:28px; flex-wrap:wrap; }
  header .logo { font-weight:700; font-size:18px; padding:14px 0; letter-spacing:.3px; }
  nav a { color:#dfe8f1; text-decoration:none; padding:16px 10px; display:inline-block; }
  nav a.activo, nav a:hover { color:#fff; box-shadow: inset 0 -3px 0 #f3c6c6; }
  main { max-width:1200px; margin:0 auto; padding:24px; }
  h1 { color:var(--azul); margin:4px 0 18px; font-size:26px; }
  h2 { color:var(--azul2); font-size:18px; margin:24px 0 10px; }
  .tarjetas { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; }
  .tarjeta { background:#fff; border:1px solid var(--borde); border-radius:10px; padding:16px; }
  .tarjeta .n { font-size:26px; font-weight:700; color:var(--azul); }
  .tarjeta .l { color:var(--gris); font-size:13px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--borde);
          border-radius:8px; overflow:hidden; }
  th, td { padding:8px 10px; border-bottom:1px solid #eee5e2; text-align:left; vertical-align:middle; }
  th { background:var(--rosa); color:#5a4a4a; font-weight:600; font-size:13px; }
  td.f { white-space:nowrap; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr:hover td { background:#fdfaf8; }
  .tabla-scroll { overflow-x:auto; }
  .badge { padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; }
  .b-OK, .b-atendido { background:#e3f2e8; color:var(--ok); }
  .b-REPONER, .b-emitido { background:#fdf0dc; color:var(--warn); }
  .b-SIN.STOCK, .b-anulado { background:#f8e0e0; color:var(--err); }
  form.inline { display:inline; }
  .filtros { display:flex; gap:10px; flex-wrap:wrap; align-items:end; margin-bottom:14px; }
  label { font-size:13px; color:var(--gris); display:block; margin-bottom:3px; }
  input, select { padding:7px 9px; border:1px solid #cfc3bf; border-radius:6px; font-size:14px;
                  background:#fff; max-width:100%; }
  button, .btn { background:var(--azul); color:#fff; border:0; border-radius:6px; padding:8px 14px;
                 cursor:pointer; font-size:14px; text-decoration:none; display:inline-block; }
  button:hover, .btn:hover { background:var(--azul2); }
  .btn-sec { background:#fff; color:var(--azul); border:1px solid var(--azul); }
  .btn-sec:hover { background:#eef3f8; }
  .btn-peligro { background:var(--err); }
  .btn-chico { padding:4px 9px; font-size:12px; }
  .flash { padding:10px 14px; border-radius:8px; margin-bottom:14px; }
  .flash.ok { background:#e3f2e8; color:var(--ok); border:1px solid #bfe0cb; }
  .flash.error { background:#f8e0e0; color:var(--err); border:1px solid #efc2c2; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:18px; }
  .caja { background:#fff; border:1px solid var(--borde); border-radius:10px; padding:16px; }
  .caja h2 { margin-top:0; }
  .campos { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .ayuda { color:var(--gris); font-size:13px; }
  pre { background:#2b2b2b; color:#e8e8e8; padding:12px; border-radius:8px; overflow-x:auto; font-size:12px; }
  .tabs a { margin-right:6px; margin-bottom:6px; }
</style>
</head>
<body>
<header>
  <div class="logo">Distribuidora La Mundial</div>
  <nav>
    {% set ep = request.endpoint or '' %}
    <a href="{{ url_for('inicio') }}" class="{{ 'activo' if ep=='inicio' }}">Inicio</a>
    <a href="{{ url_for('productos') }}" class="{{ 'activo' if ep.startswith('producto') }}">Productos y stock</a>
    <a href="{{ url_for('venta_nueva') }}" class="{{ 'activo' if ep=='venta_nueva' }}">Nueva venta</a>
    <a href="{{ url_for('ventas') }}" class="{{ 'activo' if ep in ('ventas','venta_detalle') }}">Ventas</a>
    <a href="{{ url_for('reportes') }}" class="{{ 'activo' if ep=='reportes' }}">Reportes</a>
    <a href="{{ url_for('procesos') }}" class="{{ 'activo' if ep=='procesos' }}">Procesos masivos</a>
  </nav>
</header>
<main>
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% block contenido %}{% endblock %}
</main>
</body>
</html>
